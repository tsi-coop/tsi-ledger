<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal Entries - TSI Ledger Ops Console</title>
  <link rel="stylesheet" href="assets/console.css">
</head>
<body>
<script src="assets/console.js"></script>
<script>
  const content = renderShell('entries', 'Journal Entries', 'Org-wide ledger - browse every App\'s postings, post manual entries, and request/approve reversals.');
  content.innerHTML = `<div id="entries-app"></div>`;

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="view-modal">
      <div class="modal">
        <h2>Entry Detail</h2>
        <pre id="view-modal-body" class="mono" style="white-space:pre-wrap"></pre>
        <div class="modal-actions">
          <button class="danger" id="view-reverse-btn" style="display:none">Request Reversal</button>
          <button onclick="closeModal('view-modal')">Close</button>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="reverse-modal">
      <div class="modal">
        <h2>Request Reversal</h2>
        <p class="hint">A different Admin must approve this before the offsetting entry posts (maker-checker).</p>
        <div class="field"><label for="reverse-reason">Reason</label><textarea id="reverse-reason" rows="3" required></textarea></div>
        <div class="modal-actions">
          <button onclick="closeModal('reverse-modal')">Cancel</button>
          <button class="primary" id="reverse-submit-btn">Submit Request</button>
        </div>
      </div>
    </div>
  `);
  let accountsCache = [];
  let appsCache = [];
  let lineSeq = 0;
  let offset = 0;
  let reversingEntryId = null;
  const PAGE_SIZE = 25;

  async function init() {
    const admin = isAdmin();
    const app = qs('entries-app');
    app.innerHTML = `
      <div class="card">
        <h2>Post Manual Entry</h2>
        <div id="post-result"></div>
        <form id="post-form">
          <div class="field-row">
            <div class="field">
              <label for="e-app">App</label>
              <select id="e-app" required></select>
            </div>
            <div class="field">
              <label for="e-reference">Reference ID</label>
              <input id="e-reference" required maxlength="128" placeholder="ADJ-2026-0042">
            </div>
            <div class="field">
              <label for="e-posted-at">Posted At</label>
              <input id="e-posted-at" type="datetime-local" required>
            </div>
          </div>
          <div class="field">
            <label for="e-description">Description</label>
            <input id="e-description" required maxlength="500" placeholder="Manual correcting entry">
          </div>

          <label>Lines</label>
          <div id="lines-container" class="entry-lines-editor"></div>
          <button type="button" class="small" id="add-line-btn">+ Add Line</button>

          <div id="balance-check" class="balance-check"></div>

          <div style="margin-top:16px">
            <button type="submit" class="primary" id="post-submit-btn">Post Entry</button>
          </div>
        </form>
        <p class="hint" id="no-accounts-hint" style="display:none">
          No active accounts yet - create some on the <a href="accounts.html">Chart of Accounts</a> page first.
        </p>
      </div>

      ${admin ? `
      <div class="card">
        <h2>Reversal Approvals <span id="pending-count" class="badge amber" style="display:none"></span></h2>
        <p class="page-sub" style="margin-top:-6px">Maker-checker: you cannot approve a reversal you requested yourself.</p>
        <div id="approvals-error"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>App</th><th>Entry Seq</th><th>Requested By</th><th>Reason</th><th>Requested</th><th></th></tr></thead>
            <tbody id="approvals-body"><tr class="empty-row"><td colspan="6">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>` : ''}

      <div class="card">
        <h2>
          Entries
          <span style="display:flex;gap:8px;align-items:center">
            <select id="filter-app" style="width:auto"><option value="">All Apps</option></select>
            <button class="small" id="refresh-entries-btn">Refresh</button>
          </span>
        </h2>
        <div id="entries-error"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Seq</th><th>App</th><th>Reference</th><th>Description</th><th>Type</th><th>Posted At</th><th>Block Hash</th><th></th></tr></thead>
            <tbody id="entries-body"><tr class="empty-row"><td colspan="8">Loading…</td></tr></tbody>
          </table>
        </div>
        <div style="text-align:center;margin-top:12px">
          <button class="small" id="load-more-btn" style="display:none">Load More</button>
        </div>
      </div>
    `;

    const now = new Date();
    qs('e-posted-at').value = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

    qs('add-line-btn').addEventListener('click', () => addLine());
    qs('post-form').addEventListener('submit', submitEntry);
    qs('refresh-entries-btn').addEventListener('click', () => { offset = 0; loadEntries(); });
    qs('load-more-btn').addEventListener('click', () => { offset += PAGE_SIZE; loadEntries(true); });
    qs('filter-app').addEventListener('change', () => { offset = 0; loadEntries(); });

    await loadApps();
    await loadAccountsThenSeedLines();
    loadEntries();
    if (admin) loadApprovals();
  }

  async function loadApps() {
    try {
      appsCache = await consoleApi('/api/v1/app', 'list_apps');
    } catch (e) { appsCache = []; }
    const options = appsCache.map(a => `<option value="${esc(a.id)}">${esc(a.app_name)}</option>`).join('');
    qs('e-app').innerHTML = options;
    qs('filter-app').innerHTML = '<option value="">All Apps</option>' + options;
  }

  async function loadAccountsThenSeedLines() {
    try {
      accountsCache = await consoleApi('/api/v1/accounts', 'list_accounts', {});
    } catch (e) {
      accountsCache = [];
    }
    if (accountsCache.length === 0) {
      qs('no-accounts-hint').style.display = 'block';
      qs('post-submit-btn').disabled = true;
    } else {
      addLine('DEBIT');
      addLine('CREDIT');
    }
  }

  function addLine(defaultType) {
    lineSeq++;
    const id = 'line-' + lineSeq;
    const options = accountsCache.map(a => `<option value="${esc(a.account_code)}">${esc(a.account_code)} - ${esc(a.account_name)}</option>`).join('');
    qs('lines-container').insertAdjacentHTML('beforeend', `
      <div class="line-row" id="${id}">
        <div><label>Account</label><select class="line-account">${options}</select></div>
        <div><label>Type</label>
          <select class="line-type">
            <option value="DEBIT" ${defaultType === 'DEBIT' ? 'selected' : ''}>DEBIT</option>
            <option value="CREDIT" ${defaultType === 'CREDIT' ? 'selected' : ''}>CREDIT</option>
          </select>
        </div>
        <div><label>Amount</label><input type="number" class="line-amount" step="0.0001" min="0.0001" value="0.00"></div>
        <div><button type="button" class="small line-remove" title="Remove line">&times;</button></div>
      </div>`);
    qs(id).querySelector('.line-remove').addEventListener('click', () => { qs(id).remove(); recalcBalance(); });
    qs(id).querySelectorAll('.line-amount, .line-type').forEach(el => el.addEventListener('input', recalcBalance));
    recalcBalance();
  }

  function recalcBalance() {
    const rows = Array.from(document.querySelectorAll('#lines-container .line-row'));
    let debit = 0, credit = 0;
    rows.forEach(r => {
      const amt = parseFloat(r.querySelector('.line-amount').value) || 0;
      const type = r.querySelector('.line-type').value;
      if (type === 'DEBIT') debit += amt; else credit += amt;
    });
    rows.forEach(r => { r.querySelector('.line-remove').disabled = rows.length <= 2; });

    const box = qs('balance-check');
    const balanced = rows.length >= 2 && Math.abs(debit - credit) < 1e-9;
    box.className = 'balance-check ' + (balanced ? 'ok' : 'bad');
    box.textContent = `Debits ${fmtAmount(debit)} - Credits ${fmtAmount(credit)} - ${balanced ? 'Balanced ✓' : 'Not balanced'}`;
    qs('post-submit-btn').disabled = !balanced;
    return balanced;
  }

  async function submitEntry(e) {
    e.preventDefault();
    if (!recalcBalance()) return;

    const rows = Array.from(document.querySelectorAll('#lines-container .line-row'));
    const lines = rows.map(r => ({
      account_code: r.querySelector('.line-account').value,
      type: r.querySelector('.line-type').value,
      amount: parseFloat(r.querySelector('.line-amount').value)
    }));

    const postedAtLocal = qs('e-posted-at').value;
    const postedAtIso = postedAtLocal ? new Date(postedAtLocal).toISOString() : null;

    const resultBox = qs('post-result');
    resultBox.innerHTML = '';
    const btn = qs('post-submit-btn');
    btn.disabled = true; btn.textContent = 'Posting…';

    try {
      const entry = await consoleApi('/api/v1/ledger', 'post_entry', {
        app_id: qs('e-app').value,
        reference_id: qs('e-reference').value.trim(),
        description: qs('e-description').value.trim(),
        posted_at: postedAtIso,
        lines: lines
      }, { 'Idempotency-Key': genIdempotencyKey() });

      resultBox.innerHTML = `<div class="alert success">
        Posted as sequence #${entry.sequence_number}${entry.idempotent_replay ? ' (idempotent replay of an existing entry)' : ''}.
        block_hash: <code>${esc(shortId(entry.block_hash))}</code>
      </div>`;

      qs('e-reference').value = '';
      qs('e-description').value = '';
      offset = 0;
      loadEntries();
    } catch (err) {
      resultBox.innerHTML = `<div class="alert error">${esc(err.message)}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = 'Post Entry';
      recalcBalance();
    }
  }

  async function loadEntries(append) {
    const body = qs('entries-body');
    const errBox = qs('entries-error');
    errBox.innerHTML = '';
    if (!append) body.innerHTML = '<tr class="empty-row"><td colspan="8">Loading…</td></tr>';
    try {
      const params = { limit: PAGE_SIZE, offset: offset };
      const appFilter = qs('filter-app').value;
      if (appFilter) params.app_id = appFilter;
      const result = await consoleApi('/api/v1/ledger', 'list_entries', params);
      const rowsHtml = result.entries.map(e => `
        <tr>
          <td>${e.sequence_number}</td>
          <td>${esc(e.app_name)}</td>
          <td>${esc(e.reference_id)}</td>
          <td>${esc(e.description)}</td>
          <td><span class="badge ${e.entry_type === 'REVERSAL' ? 'amber' : 'gray'}">${esc(e.entry_type)}</span></td>
          <td>${fmtDate(e.posted_at)}</td>
          <td><code title="${esc(e.block_hash)}">${shortId(e.block_hash)}</code></td>
          <td><button class="small" onclick='viewEntry(${JSON.stringify(e.id)})'>View</button></td>
        </tr>`).join('');

      if (!append) {
        body.innerHTML = result.entries.length === 0 ? '<tr class="empty-row"><td colspan="8">No entries posted yet.</td></tr>' : rowsHtml;
      } else {
        body.insertAdjacentHTML('beforeend', rowsHtml);
      }
      qs('load-more-btn').style.display = result.count === PAGE_SIZE ? 'inline-flex' : 'none';
    } catch (e) {
      errBox.innerHTML = `<div class="alert error">${esc(e.message)}</div>`;
    }
  }

  async function viewEntry(id) {
    try {
      const entry = await consoleApi('/api/v1/ledger', 'get_entry', { entry_id: id });
      qs('view-modal-body').textContent = JSON.stringify(entry, null, 2);
      const reverseBtn = qs('view-reverse-btn');
      if (entry.entry_type === 'STANDARD') {
        reverseBtn.style.display = 'inline-flex';
        reverseBtn.onclick = () => { closeModal('view-modal'); openReverseModal(id); };
      } else {
        reverseBtn.style.display = 'none';
      }
      qs('view-modal').classList.add('open');
    } catch (e) { alert('Failed to load entry: ' + e.message); }
  }

  function openReverseModal(entryId) {
    reversingEntryId = entryId;
    qs('reverse-reason').value = '';
    openModal('reverse-modal');
  }

  document.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'reverse-submit-btn') submitReversalRequest();
  });

  async function submitReversalRequest() {
    const reason = qs('reverse-reason').value.trim();
    if (!reason) { alert('A reason is required.'); return; }
    try {
      await consoleApi('/api/v1/ledger', 'request_reversal', { entry_id: reversingEntryId, reason });
      closeModal('reverse-modal');
      alert('Reversal requested - a different Admin needs to approve it before it posts.');
      if (isAdmin()) loadApprovals();
    } catch (e) { alert('Request failed: ' + e.message); }
  }

  async function loadApprovals() {
    const body = qs('approvals-body');
    const errBox = qs('approvals-error');
    if (!body) return;
    errBox.innerHTML = '';
    try {
      const requests = await consoleApi('/api/v1/ledger', 'list_reversal_requests', { status: 'PENDING' });
      const countBadge = qs('pending-count');
      if (requests.length > 0) { countBadge.textContent = requests.length; countBadge.style.display = 'inline-block'; }
      else countBadge.style.display = 'none';

      body.innerHTML = requests.length === 0
        ? '<tr class="empty-row"><td colspan="6">No pending reversal requests.</td></tr>'
        : requests.map(r => {
            const isOwn = currentUser && r.requested_by_user_id === currentUser.user_id;
            return `
          <tr>
            <td>${esc(r.app_name)}</td>
            <td>#${r.sequence_number}</td>
            <td>${esc(r.requested_by_name)}</td>
            <td>${esc(r.reason)}</td>
            <td>${fmtDate(r.created_at)}</td>
            <td>
              <button class="small" ${isOwn ? 'disabled title="You cannot approve your own request"' : ''} onclick="approveRequest('${r.id}')">Approve</button>
              <button class="small danger" onclick="rejectRequest('${r.id}')">Reject</button>
            </td>
          </tr>`;
          }).join('');
    } catch (e) {
      errBox.innerHTML = `<div class="alert error">${esc(e.message)}</div>`;
    }
  }

  async function approveRequest(id) {
    if (!confirm('Approve this reversal? The offsetting entry will post immediately.')) return;
    try {
      await consoleApi('/api/v1/ledger', 'approve_reversal', { reversal_request_id: id });
      loadApprovals();
      offset = 0;
      loadEntries();
    } catch (e) { alert('Approve failed: ' + e.message); }
  }

  async function rejectRequest(id) {
    const reason = prompt('Reason for rejecting (optional):') || '';
    try {
      await consoleApi('/api/v1/ledger', 'reject_reversal', { reversal_request_id: id, decision_reason: reason });
      loadApprovals();
    } catch (e) { alert('Reject failed: ' + e.message); }
  }

  meReady.then(init);
</script>
</body>
</html>

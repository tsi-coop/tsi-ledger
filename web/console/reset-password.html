<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSI Ledger - Reset Password</title>
  <link rel="stylesheet" href="assets/console.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 100%; max-width: 380px; }
    .login-brand { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--primary); font-size: 1.35rem; margin-bottom: 4px; }
    .login-card .tagline { text-align: center; color: var(--ink); font-size: 0.85rem; font-weight: 600; margin: 0 0 6px; }
    .login-card .sub { text-align: center; color: var(--muted); margin-bottom: 24px; }
    .login-card button { width: 100%; justify-content: center; margin-top: 6px; }
  </style>
</head>
<body>

<div class="card login-card">
  <div class="login-brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="20" height="20" rx="6" fill="currentColor"/>
        <path d="M6 8h10M6 11h10M6 14h6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="brand-word"><strong>TSI</strong> Ledger</span>
  </div>
  <p class="tagline">An open-source API first double entry accounting engine</p>
  <p class="sub">Redeem the reset key an Admin gave you</p>

  <div id="reset-error" class="alert error" style="display:none"></div>
  <div id="reset-success" class="alert success" style="display:none"></div>

  <form id="reset-form">
    <div class="field">
      <label for="reset-email">Email</label>
      <input id="reset-email" type="email" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="reset-key">Reset Key</label>
      <input id="reset-key" type="text" autocomplete="one-time-code" required placeholder="e.g. AB3D-4KLM-9PQR-TZX2">
    </div>
    <div class="field">
      <label for="reset-new-password">New Password</label>
      <input id="reset-new-password" type="password" autocomplete="new-password" required minlength="12" placeholder="Minimum 12 characters">
    </div>
    <button type="submit" class="primary" id="reset-btn">Reset Password</button>
  </form>
  <p class="hint" style="text-align:center;margin-top:16px">
    <a href="login.html">Back to sign in</a>
  </p>
</div>

<script src="assets/console.js"></script>
<script>
  const form = document.getElementById('reset-form');
  const errorBox = document.getElementById('reset-error');
  const successBox = document.getElementById('reset-success');
  const btn = document.getElementById('reset-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    successBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Resetting…';

    try {
      const res = await fetch('/api/v1/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          _func: 'reset_with_key',
          email: qs('reset-email').value.trim(),
          reset_key: qs('reset-key').value.trim(),
          new_password: qs('reset-new-password').value
        })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.password_reset) {
        form.style.display = 'none';
        successBox.textContent = 'Password reset. You can now sign in with your new password.';
        successBox.style.display = 'block';
        return;
      }
      errorBox.textContent = data.message || 'Invalid or expired reset key.';
      errorBox.style.display = 'block';
    } catch (err) {
      errorBox.textContent = 'Could not reach the server: ' + err.message;
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  });
</script>
</body>
</html>

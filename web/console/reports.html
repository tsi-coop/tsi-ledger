<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - TSI Ledger Ops Console</title>
  <link rel="stylesheet" href="assets/console.css">
</head>
<body>
<script src="assets/console.js"></script>
<script>
  const content = renderShell('reports', 'Reports', 'Trial balance, balance sheet, and income statement, computed live from journal_entries/entry_lines - combined across all Apps by default.');
  content.innerHTML = `<div id="reports-app"></div>`;

  let appsCache = [];

  async function init() {
    try { appsCache = await consoleApi('/api/v1/app', 'list_apps'); } catch (e) { appsCache = []; }
    const appOptions = '<option value="">All Apps</option>' + appsCache.map(a => `<option value="${esc(a.id)}">${esc(a.app_name)}</option>`).join('');

    const app = qs('reports-app');
    app.innerHTML = `
      <div class="card">
        <h2>Trial Balance</h2>
        <div class="field-row" style="align-items:end;max-width:560px">
          <div class="field"><label for="tb-app">App</label><select id="tb-app">${appOptions}</select></div>
          <div class="field">
            <label for="tb-date">As Of Date (optional)</label>
            <input id="tb-date" type="date">
          </div>
          <div class="field"><button class="primary" id="tb-run">Run</button></div>
        </div>
        <div id="tb-result"></div>
      </div>

      <div class="card">
        <h2>Balance Sheet</h2>
        <p class="hint" style="margin-top:-6px">Assets = Liabilities + Equity. Revenue/Expense accounts aren't
          included - there's no closing-entry mechanism in this ledger to fold them into Equity, so they appear
          on the Trial Balance above and on the Income Statement below instead.</p>
        <div class="field-row" style="align-items:end;max-width:560px">
          <div class="field"><label for="bs-app">App</label><select id="bs-app">${appOptions}</select></div>
          <div class="field">
            <label for="bs-date">As Of Date (optional)</label>
            <input id="bs-date" type="date">
          </div>
          <div class="field"><button class="primary" id="bs-run">Run</button></div>
        </div>
        <div id="bs-result"></div>
      </div>

      <div class="card">
        <h2>Income Statement</h2>
        <p class="hint" style="margin-top:-6px">Revenue and Expense activity posted within a date range (a period
          total, not a running balance) - both dates optional: leave From blank for life-to-date, leave To blank
          for through now.</p>
        <div class="field-row" style="align-items:end;max-width:720px">
          <div class="field"><label for="is-app">App</label><select id="is-app">${appOptions}</select></div>
          <div class="field"><label for="is-from">From (optional)</label><input id="is-from" type="date"></div>
          <div class="field"><label for="is-to">To (optional)</label><input id="is-to" type="date"></div>
          <div class="field"><button class="primary" id="is-run">Run</button></div>
        </div>
        <div id="is-result"></div>
      </div>

      <div class="card">
        <h2>Raw Journal Entries Export</h2>
        <p class="page-sub">One CSV row per debit/credit leg, joined to its parent entry and account - for
          reconciliation or loading into another tool.</p>
        <div class="field-row" style="align-items:end;max-width:720px">
          <div class="field"><label for="exp-app">App</label><select id="exp-app">${appOptions}</select></div>
          <div class="field"><label for="exp-from">From (optional)</label><input id="exp-from" type="date"></div>
          <div class="field"><label for="exp-to">To (optional)</label><input id="exp-to" type="date"></div>
          <div class="field"><button class="primary" id="exp-run">Download CSV</button></div>
        </div>
        <div id="exp-result"></div>
      </div>
    `;
    qs('tb-run').addEventListener('click', runTrialBalance);
    qs('bs-run').addEventListener('click', runBalanceSheet);
    qs('is-run').addEventListener('click', runIncomeStatement);
    qs('exp-run').addEventListener('click', runExport);
  }

  async function runTrialBalance() {
    const box = qs('tb-result');
    box.innerHTML = '<p class="spinner">Loading…</p>';
    try {
      const params = {};
      if (qs('tb-date').value) params.as_of_date = qs('tb-date').value;
      if (qs('tb-app').value) params.app_id = qs('tb-app').value;
      const r = await consoleApi('/api/v1/reports', 'trial_balance', params);

      box.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Code</th><th>Name</th><th>Type</th><th class="right">Debit</th><th class="right">Credit</th></tr></thead>
            <tbody>
              ${r.accounts.length === 0 ? '<tr class="empty-row"><td colspan="5">No accounts.</td></tr>' : r.accounts.map(a => `
                <tr>
                  <td><code>${esc(a.account_code)}</code></td>
                  <td>${esc(a.account_name)}</td>
                  <td><span class="badge gray">${esc(a.account_type)}</span></td>
                  <td class="right">${fmtAmount(a.debit_total)}</td>
                  <td class="right">${fmtAmount(a.credit_total)}</td>
                </tr>`).join('')}
            </tbody>
            <tfoot>
              <tr style="font-weight:700">
                <td colspan="3">Total</td>
                <td class="right">${fmtAmount(r.total_debits)}</td>
                <td class="right">${fmtAmount(r.total_credits)}</td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div class="alert ${r.balanced ? 'success' : 'error'}" style="margin-top:14px">
          ${r.balanced ? 'Balanced ✓ - total debits equal total credits.' : 'Not balanced - this should never happen on an untampered chain.'}
        </div>
      `;
    } catch (e) {
      box.innerHTML = `<div class="alert error">${esc(e.message)}</div>`;
    }
  }

  function balanceSheetSection(title, rows) {
    return `
      <h2 style="font-size:0.95rem;margin-top:18px">${esc(title)}</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Code</th><th>Name</th><th class="right">Balance</th></tr></thead>
          <tbody>
            ${rows.length === 0 ? '<tr class="empty-row"><td colspan="3">None.</td></tr>' : rows.map(a => `
              <tr><td><code>${esc(a.account_code)}</code></td><td>${esc(a.account_name)}</td><td class="right">${fmtAmount(a.balance)}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  async function runBalanceSheet() {
    const box = qs('bs-result');
    box.innerHTML = '<p class="spinner">Loading…</p>';
    try {
      const params = {};
      if (qs('bs-date').value) params.as_of_date = qs('bs-date').value;
      if (qs('bs-app').value) params.app_id = qs('bs-app').value;
      const r = await consoleApi('/api/v1/reports', 'balance_sheet', params);

      box.innerHTML = `
        <div class="stat-grid">
          <div class="stat-card"><div class="label">Assets</div><div class="value">${fmtAmount(r.assets_total)}</div></div>
          <div class="stat-card"><div class="label">Liabilities</div><div class="value">${fmtAmount(r.liabilities_total)}</div></div>
          <div class="stat-card"><div class="label">Equity</div><div class="value">${fmtAmount(r.equity_total)}</div></div>
        </div>
        ${balanceSheetSection('Assets', r.assets)}
        ${balanceSheetSection('Liabilities', r.liabilities)}
        ${balanceSheetSection('Equity', r.equity)}
        <div class="alert ${r.balanced ? 'success' : 'warn'}" style="margin-top:14px">
          ${r.balanced
            ? 'Balanced ✓ - Assets = Liabilities + Equity.'
            : `Not balanced (Assets ${fmtAmount(r.assets_total)} vs L+E ${fmtAmount(Number(r.liabilities_total) + Number(r.equity_total))}) - expected if Revenue/Expense activity hasn't been closed to Equity.`}
        </div>
      `;
    } catch (e) {
      box.innerHTML = `<div class="alert error">${esc(e.message)}</div>`;
    }
  }

  function incomeStatementSection(title, rows) {
    return `
      <h2 style="font-size:0.95rem;margin-top:18px">${esc(title)}</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Code</th><th>Name</th><th class="right">Amount</th></tr></thead>
          <tbody>
            ${rows.length === 0 ? '<tr class="empty-row"><td colspan="3">None.</td></tr>' : rows.map(a => `
              <tr><td><code>${esc(a.account_code)}</code></td><td>${esc(a.account_name)}</td><td class="right">${fmtAmount(a.amount)}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  async function runIncomeStatement() {
    const box = qs('is-result');
    box.innerHTML = '<p class="spinner">Loading…</p>';
    try {
      const params = {};
      if (qs('is-from').value) params.date_from = qs('is-from').value;
      if (qs('is-to').value) params.date_to = qs('is-to').value;
      if (qs('is-app').value) params.app_id = qs('is-app').value;
      const r = await consoleApi('/api/v1/reports', 'income_statement', params);

      box.innerHTML = `
        <div class="stat-grid">
          <div class="stat-card"><div class="label">Revenue</div><div class="value">${fmtAmount(r.revenue_total)}</div></div>
          <div class="stat-card"><div class="label">Expense</div><div class="value">${fmtAmount(r.expense_total)}</div></div>
          <div class="stat-card ${Number(r.net_income) >= 0 ? 'ok' : 'bad'}"><div class="label">Net Income</div><div class="value">${fmtAmount(r.net_income)}</div></div>
        </div>
        ${incomeStatementSection('Revenue', r.revenue)}
        ${incomeStatementSection('Expense', r.expense)}
      `;
    } catch (e) {
      box.innerHTML = `<div class="alert error">${esc(e.message)}</div>`;
    }
  }

  async function runExport() {
    const box = qs('exp-result');
    box.innerHTML = '<p class="spinner">Preparing download…</p>';
    try {
      const params = {};
      if (qs('exp-app').value) params.app_id = qs('exp-app').value;
      if (qs('exp-from').value) params.date_from = qs('exp-from').value;
      if (qs('exp-to').value) params.date_to = qs('exp-to').value;
      await consoleDownload('/api/v1/reports', 'export_entries', params, 'journal_entries.csv');
      box.innerHTML = '<div class="alert success">Download started.</div>';
    } catch (e) {
      box.innerHTML = `<div class="alert error">${esc(e.message)}</div>`;
    }
  }

  meReady.then(init);
</script>
</body>
</html>

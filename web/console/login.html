<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSI Ledger - Login</title>
  <link rel="stylesheet" href="assets/console.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 100%; max-width: 380px; }
    .login-brand { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--primary); font-size: 1.35rem; margin-bottom: 4px; }
    .login-card .tagline { text-align: center; color: var(--ink); font-size: 0.85rem; font-weight: 600; margin: 0 0 24px; }
    .login-card button { width: 100%; justify-content: center; margin-top: 6px; }
  </style>
</head>
<body>

<div class="card login-card">
  <div class="login-brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="20" height="20" rx="6" fill="currentColor"/>
        <path d="M6 8h10M6 11h10M6 14h6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="brand-word"><strong>TSI</strong> Ledger</span>
  </div>
  <p class="tagline">An open-source API first double entry accounting engine</p>

  <div id="login-error" class="alert error" style="display:none"></div>
  <div id="login-loading" class="spinner">Checking system status…</div>

  <form id="login-form" style="display:none">
    <div class="field">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="primary" id="login-btn">Sign In</button>
  </form>
  <p class="hint" style="text-align:center;margin-top:16px">
    Have a reset key? <a href="reset-password.html">Reset your password</a>.<br>
    New here? Take the <a href="../tour/index.html">console tour</a>.
  </p>
</div>

<script src="assets/console.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || 'dashboard.html';

  (async () => {
    try {
      // If a session cookie is already valid, skip straight past the login form.
      const res = await fetch('/api/v1/auth', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ _func: 'me' })
      });
      if (res.ok) { location.href = next; return; }
    } catch (e) { /* fall through to login form */ }

    // Not signed in - check whether the system has been bootstrapped yet.
    try {
      const statusRes = await fetch('/api/v1/setup', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ _func: 'setup_status' })
      });
      const status = await statusRes.json().catch(() => ({}));
      if (statusRes.ok && status.configured === false) {
        location.href = 'setup/init.html';
        return;
      }
    } catch (e) { /* fall through to login form regardless */ }

    qs('login-loading').style.display = 'none';
    qs('login-form').style.display = 'block';
  })();

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const res = await fetch('/api/v1/auth', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ _func: 'login', email: qs('login-email').value.trim(), password: qs('login-password').value })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.authenticated) {
        location.href = next;
        return;
      }
      errorBox.textContent = data.message || 'Invalid email or password.';
      errorBox.style.display = 'block';
    } catch (err) {
      errorBox.textContent = 'Could not reach the server: ' + err.message;
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>

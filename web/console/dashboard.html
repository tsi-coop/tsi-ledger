<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - TSI Ledger Ops Console</title>
  <link rel="stylesheet" href="assets/console.css">
</head>
<body>
<script src="assets/console.js"></script>
<script>
  const content = renderShell('dashboard', 'Dashboard', 'One organization-wide ledger - every App posts here against the shared Chart of Accounts.');

  qs('shell-page-header').insertAdjacentHTML('beforeend',
    '<button class="ghost help-icon-btn" id="dashboard-help-btn" title="About this console" aria-label="About this console">?</button>');

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="welcome-modal">
      <div class="modal">
        <h2>Welcome, <span id="welcome-name">-</span></h2>
        <p>This console manages one shared, organization-wide ledger. Apps (HRMS, Commerce, Lending, ...) post
          journal entries via their own API key, always against the same <a href="accounts.html">Chart of Accounts</a>.</p>
        <ul>
          <li><strong>Operators</strong> browse the COA/ledger, post manual entries, and request reversals.</li>
          <li><strong>Admins</strong> additionally provision <a href="apps.html">Apps &amp; API keys</a>, manage the
            <a href="accounts.html">Chart of Accounts</a> structure, manage <a href="users.html">Users</a>, and approve
            or reject reversal requests on the <a href="entries.html">Journal Entries</a> page (maker-checker - a
            different Admin than the requester must decide).</li>
        </ul>
        <div class="modal-actions"><button class="primary" onclick="closeModal('welcome-modal')">Got it</button></div>
      </div>
    </div>
  `);
  qs('dashboard-help-btn').addEventListener('click', () => openModal('welcome-modal'));

  content.innerHTML = `
    <div class="stat-grid" id="stat-grid">
      <div class="stat-card"><div class="label">Apps</div><div class="value" id="stat-apps">-</div></div>
      <div class="stat-card ok"><div class="label">Accounts (COA)</div><div class="value" id="stat-accounts">-</div></div>
      <div class="stat-card"><div class="label">Operators</div><div class="value" id="stat-operators">-</div></div>
      <div class="stat-card" id="stat-pending-card"><div class="label">Pending Reversals</div><div class="value" id="stat-pending">-</div></div>
    </div>

    <div class="card">
      <h2>Recent Apps</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>App Name</th><th>Status</th><th>Key</th><th>Created</th></tr></thead>
          <tbody id="recent-apps-body"><tr class="empty-row"><td colspan="4">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  `;

  async function load() {
    const me = await meReady;
    if (me) qs('welcome-name').textContent = me.name;
    if (!isAdmin()) qs('stat-pending-card').style.display = 'none';

    try {
      const apps = await consoleApi('/api/v1/app', 'list_apps');
      qs('stat-apps').textContent = apps.length;
      const recent = apps.slice(0, 8);
      qs('recent-apps-body').innerHTML = recent.length === 0
        ? '<tr class="empty-row"><td colspan="4">No Apps yet.</td></tr>'
        : recent.map(a => `
          <tr>
            <td>${esc(a.app_name)}</td>
            <td>${a.is_active ? '<span class="badge green">Active</span>' : '<span class="badge red">Inactive</span>'}</td>
            <td>${a.has_key ? '<span class="badge blue">Set</span>' : '<span class="badge gray">Revoked</span>'}</td>
            <td>${fmtDate(a.created_at)}</td>
          </tr>`).join('');
    } catch (e) {
      qs('recent-apps-body').innerHTML = `<tr class="empty-row"><td colspan="4">${esc(e.message)}</td></tr>`;
    }

    try {
      const accounts = await consoleApi('/api/v1/accounts', 'list_accounts', { include_inactive: true });
      qs('stat-accounts').textContent = accounts.length;
    } catch (e) { qs('stat-accounts').textContent = '-'; }

    if (isAdmin()) {
      try {
        const operators = await consoleApi('/api/v1/users', 'list_operators');
        qs('stat-operators').textContent = operators.length;
      } catch (e) { qs('stat-operators').textContent = '-'; }

      try {
        const pending = await consoleApi('/api/v1/ledger', 'list_reversal_requests', { status: 'PENDING' });
        qs('stat-pending').textContent = pending.length;
      } catch (e) { qs('stat-pending').textContent = '-'; }
    } else {
      qs('stat-operators').textContent = '-';
    }
  }

  load();
</script>
</body>
</html>
